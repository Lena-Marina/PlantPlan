<main
  class="main container-fluid"
  [class.admin-theme]="isAdmin()"
  [class.gardener-theme]="!isAdmin()"
>
  <div class="row">
   <div class="header-container col-12">
      <app-header ></app-header>
   </div> 

    <div class="content-container">
      
      <div class="menu-container" 
        [class.col-2]="appState.menuOpen() && !isMobile()"
        [class.col-12]="appState.menuOpen() && isMobile()"
        >
        <app-menu></app-menu>
      </div>

      <div class="router-outlet-container"
        [class.col-10]="appState.menuOpen() && !isMobile()"
        [class.max-width]="!appState.menuOpen() && !isMobile()"
        [class.col-12]="isMobile()">
        <router-outlet />
      </div>
    </div>
    
    <div class="footer-container col-12">
      <app-footer></app-footer>
    </div>
    

  </div>
  
</main>
