<div class="plant-plan-drop-down">

  <button class="dropdown-button" 
    type="button" 
    (click)="toggleDropdown()" 
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true" [attr.aria-label]="txtArialabel() + selected()"
  >

    @if (selected(); as option) {
    <img class="flag-img-header" 
      [src]="'/icons/flags/' + option + '.png'" 
      [alt]="txtAltTextFlag() + option"
    />
    {{ option }}
    }
    @else {
    {{ label()() }}
    }

    <span class="arrow" aria-hidden="true">
      @if (isOpen()) {
      ▲
      }
      @else {
      ▼
      }
    </span>

  </button>



  @if (isOpen()) {
  <div class="dropdown-options">
    @for (option of options; track option) {
    <button class="option" 
      type="button" 
      (click)="selectOption(option)"
      [attr.aria-label]="'Sprache auswählen: ' + option" [attr.aria-pressed]="selected() === option"
    >

      {{ option }}

      <img class="flag-img-option" 
        [src]="'/icons/flags/' + option + '.png'" 
        [alt]="txtAltTextFlag() + option" 
      />
    </button>
    }
  </div>
  }


</div>
