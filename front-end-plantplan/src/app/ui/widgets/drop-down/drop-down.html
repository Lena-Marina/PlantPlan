<div class="plant-plan-drop-down"> 

  <button
    class="dropdown-button"
    type="button"
    (click)="toggleDropdown()"
  >

    @if (selected(); as option) {
      {{ option }}
    }
    @else {
      {{ label()() }}
    }

    <span class="arrow">
      @if (isOpen()) {
        ▲
      }
      @else {
        ▼
      }
    </span>

  </button>


  @if (isOpen()) {

    <div class="dropdown-options">

      @for (option of options(); track option) {

        <div
          class="option"
          (click)="selectOption(option)"
        >
          {{ option }}
        </div>

      }

    </div>

  }

</div>
